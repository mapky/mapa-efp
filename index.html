<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="./resources/ol.css">
        <link rel="stylesheet" href="resources/fontawesome-all.min.css">
        <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
        <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
        <link rel="stylesheet" href="./resources/qgis2web.css">
        <style>
        html, body {
            background-color: transparent;
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }

        #map {
            width: 100%;
            height: calc(100% - 45px);
            padding: 0;
            margin: 0;
            border: 5px solid #444;
            box-sizing: border-box;
        }

        .ol-control > * {
            background-color: #f8f8f8!important;
            color: #444444!important;
            border-radius: 0px;
        }
        .ol-attribution a, .gcd-gl-input::placeholder, .search-layer-input-search::placeholder {
            color: #444444!important;
        }
        .search-layer-input-search {
            background-color: #f8f8f8!important;
        }
        .ol-control > *:focus, .ol-control >*:hover {
            background-color: rgba(248, 248, 248, 0.7)!important;
        } 
        .ol-control {
            background-color: rgba(255,255,255,.4) !important;
            padding: 2px !important;
        } 

        /* Štýlovanie tlačidla tlače */
        .print-container {
            display: flex;
            justify-content: flex-end;
            padding: 6px 10px;
            background-color: #f4f4f4;
        }

        .print-btn {
            padding: 6px 14px;
            font-size: 14px;
            font-weight: bold;
            background-color: #444;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .print-btn:hover {
            background-color: #222;
        }

        /* Úprava pre tlač (Ctrl+P / Tlačidlo) */
        @media print {
            .print-container {
                display: none !important;
            }

            #map {
                height: 90vh !important;
                width: 100% !important;
                border: 2px solid #000;
                break-inside: avoid;
                page-break-inside: avoid;
            }

            @page {
                margin: 1cm;
            }
        }
        </style>


        <title>Mapa ekologicko - funkčné priestory CHKO Kysuce</title>
    </head>
    <body>
        <div class="print-container">
            <button onclick="window.print()" class="print-btn">
                🖨️ Tlačiť mapu
            </button>
        </div>
    
        <div id="map">
            <div id="popup" class="ol-popup">
                <a href="#" id="popup-closer" class="ol-popup-closer"></a>
                <div id="popup-content"></div>
            </div>
        </div>
        <script src="resources/qgis2web_expressions.js"></script>
        <script src="./resources/functions.js"></script>
        <script src="./resources/ol.js"></script>
        <script src="./resources/ol-layerswitcher.js"></script>
        <script src="resources/photon-geocoder-autocomplete.min.js"></script>
        <script src="resources/olms.js"></script>
        <script src="layers/Ekologickofunknpriestory_4.js"></script><script src="layers/HraniceCHKOKysuce_5.js"></script><script src="layers/zemiaeurpskehovznamu_6.js"></script>
        <script src="styles/Ekologickofunknpriestory_4_style.js"></script><script src="styles/HraniceCHKOKysuce_5_style.js"></script><script src="styles/zemiaeurpskehovznamu_6_style.js"></script>
        <script src="./layers/layers.js" type="text/javascript"></script> 
        <script src="./resources/Autolinker.min.js"></script>
        <script src="./resources/qgis2web.js"></script>   
         
         <!-- Footer s dynamickým názvom z premennej -->
        <footer style="text-align: center; padding: 10px; background-color: #f4f4f4;">
            <h2 id="map-title"></h2>
            <p>Tematické spracovanie &copy; ŠOPSR, Správa CHKO Kysuce.</p>
        </footer>

        <script>
            // 1. Uloženie názvu do premennej
            const pageTitle = document.title;

            // 2. Vloženie hodnoty z premennej do prvku v footer-i
            document.getElementById('map-title').textContent = pageTitle;
        </script>
    </body>
</html>
